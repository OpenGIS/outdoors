name: Deploy Demo to GitHub Pages

on:
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build style and production bundle
        run: |
          npm run build
          npm run demo:build

      - name: Verify generated outputs are current
        run: |
          if [ -n "$(git status --porcelain -- style.json)" ]; then
            git status --short -- style.json
            echo "Generated files are out of date. Run npm run build and commit the result."
            exit 1
          fi

      - name: Validate style
        run: npm run validate:style

      - name: Check icon palette
        run: npm run palette:check

      - name: Check POI coverage
        run: npm run check:pois

      - name: Check screenshots
        run: npm run screenshots:check

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the production build
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
