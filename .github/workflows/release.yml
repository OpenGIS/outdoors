name: Release

on:
  push:
    branches: ["master"]
    paths: ["package.json"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Required to create tags and GitHub releases
permissions:
  contents: write

# Never run two release jobs at once; queue them instead of cancelling.
concurrency:
  group: "release"
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Read version from package.json
        id: version
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check for existing release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$version already exists; skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.release.outputs.exists == 'false'
        run: npm ci

      - name: Build style and production bundle
        if: steps.release.outputs.exists == 'false'
        run: |
          npm run build
          npm run demo:build

      - name: Verify generated outputs are current
        if: steps.release.outputs.exists == 'false'
        run: |
          if [ -n "$(git status --porcelain -- style.json)" ]; then
            git status --short -- style.json
            echo "Generated files are out of date. Run npm run build and commit the result."
            exit 1
          fi

      - name: Validate style
        if: steps.release.outputs.exists == 'false'
        run: npm run validate:style

      - name: Check icon palette
        if: steps.release.outputs.exists == 'false'
        run: npm run palette:check

      - name: Check POI coverage
        if: steps.release.outputs.exists == 'false'
        run: npm run check:pois

      - name: Check screenshots
        if: steps.release.outputs.exists == 'false'
        run: npm run screenshots:check

      - name: Create release
        if: steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="v$version"

          # gh creates the tag through the API, so no local git identity or
          # tag push is needed. Target the current commit only when the tag
          # does not already exist; retries reuse an existing tag.
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null 2>&1; then
            gh release create "$tag" --generate-notes --title "$tag"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --generate-notes --title "$tag"
          fi
